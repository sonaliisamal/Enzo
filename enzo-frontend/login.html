<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ENZO - Login</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body class="login-page">

    <div class="login-logo">ENZO</div>

    <div class="login-container">
        
        <div class="login-graphics">
            <img src="images/login-collage.png" alt="Social Event Photos" class="collage-img">
        </div>

        <div class="login-form-wrapper">
            <h2>Log into Enzo</h2>
            
            <form id="loginForm" class="login-form">
                <input type="email" id="email" placeholder="abc12345678@gmail.com" required>
                <input type="password" id="password" placeholder="abc@12345678" required>
                
                <button type="submit" class="login-btn">Log in</button>
            </form>
            
            <div class="signup-link">
                <a href="#">new account? sign up</a>
            </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>

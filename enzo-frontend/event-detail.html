<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ENZO - Event Details</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Inter:wght@400;500&display=swap" rel="stylesheet">
</head>
<body class="event-detail-page">

    <nav class="navbar">
        <div class="logo">ENZO</div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="events.html" class="active">Events</a></li>
            <li><a href="#">Logout</a></li>
            <li><a href="#">Contact Us</a></li>
        </ul>
    </nav>

    <main class="detail-wrapper">
        <div class="detail-container">
            
            <div class="detail-poster-box">
                <img src="images/hacktag.jpeg" alt="Resilience TEDx Poster">
            </div>

            <<div class="detail-info-box">
                <div class="info-row">
                    <div class="info-label">Name</div>
                    <div class="info-value" id="detailName">Loading...</div>
                </div>
                <div class="info-row">
                    <div class="info-label">Date</div>
                    <div class="info-value" id="detailDate">Loading...</div>
                </div>
                <div class="info-row">
                    <div class="info-label">Theme</div>
                    <div class="info-value" id="detailTheme">Loading...</div>
                </div>
                <div class="info-row">
                    <div class="info-label">Maximum Guest Allowed</div>
                    <div class="info-value" id="detailCapacity">Loading...</div>
                </div>
                <div class="info-row">
                    <div class="info-label">Time</div>
                    <div class="info-value" id="detailTime">Loading...</div>
                </div>
                <div class="info-row">
                    <div class="info-label">Description</div>
                    <div class="info-value description-text" id="detailDesc">Loading...</div>
                </div>
                <button id="joinEventBtn" class="join-btn">Join</button>
            </div>


            </div>
        </div>
    </main>

    <script src="script.js"></script>



    <div id="logoutModal" class="modal-overlay">
        <div class="modal-content">
            <p class="modal-text">So you just press</p>
            
            <button id="confirmLogout" class="modal-logout-btn">Logout</button>
            
            <p class="modal-text">and call it a night</p>
            
            <img src="images/monkey.png" alt="Thinking Monkey" class="monkey-img">
        </div>
    </div>
</body>
</html>

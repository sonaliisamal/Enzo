<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ENZO - College Event Management</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Inter:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="logo">ENZO</div>
        <ul class="nav-links">
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Events</a></li>
            <li><a href="#">Logout</a></li>
            <li><a href="#">Contact Us</a></li>
        </ul>
    </nav>

    <header class="hero">
        <div class="hero-content">
            <h1>YOU BRING THE CROWD.<br>WE RUN THE CHAOS.</h1>
        </div>
    </header>

    <section class="events-section">
        <h2>Upcoming Events</h2>
        <div class="events-container">
            <div class="event-card">
                <img src="images/beyond-hack.jpg" alt="Beyond Hack" class="event-img">
                <h3>Beyond Hack</h3>
            </div>
            
            <div class="event-card">
                <img src="images/girls-night.jpg" alt="Girls Night" class="event-img">
                <h3>Girls Night</h3>
            </div>
            
            <div class="event-card">
                <img src="images/speak-up.jpg" alt="Speak up" class="event-img">
                <h3>Speak up</h3>
            </div>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
